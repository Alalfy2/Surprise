<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سؤال مهم جداً... ❤️</title>
    <!-- خط Cairo الجميل من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة Confetti للاحتفال عند الموافقة -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            overflow: hidden;
            position: relative;
        }

        /* قلوب عائمة في الخلفية */
        .floating-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            animation: floatUp 6s linear infinite;
            bottom: -50px;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* البطاقة الزجاجية الرئيسية */
        .glass-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .main-image {
            width: 170px;
            height: auto;
            border-radius: 20px;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.1));
            margin-bottom: 15px;
            transition: transform 0.3s;
        }

        .main-image:hover {
            transform: scale(1.05);
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 60px;
        }

        button {
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* زر أيوة */
        #yes-btn {
            background: linear-gradient(135deg, #ff4b72, #ff2a5f);
            color: #ffffff;
            z-index: 5;
        }

        #yes-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 10px 25px rgba(255, 42, 95, 0.4);
        }

        /* زر لأ الشقي */
        #no-btn {
            background-color: #ffffff;
            color: #ff4b72;
            white-space: nowrap;
            transition: transform 0.15s ease-out;
        }

        #result-container {
            display: none;
        }

        .love-subtext {
            color: #ffffff;
            font-size: 1.1rem;
            margin-top: 10px;
            font-weight: bold;
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <audio id="celebration-music" src="https://cdn.pixabay.com/audio/2022/02/14/audio_204179155d.mp3" loop></audio>

    <div class="glass-card">
        <!-- شاشة السؤال -->
        <div id="question-container">
            <img class="main-image" src="https://media.tenor.com/ASK-q0W2d5AAAAi/bear-love.gif" alt="Cute Bear">
            <h2>بتحبيني؟ 🥺❤️</h2>
            <div class="buttons-container">
                <button id="yes-btn">أيوة طبعاً! ✨</button>
                <button id="no-btn">لأ</button>
            </div>
        </div>

        <!-- شاشة النتيجة -->
        <div id="result-container">
            <img class="main-image" src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-love.gif" alt="Happy Bears">
            <h2>كنت متأكد والله! 🥰💍</h2>
            <p class="love-subtext">ربنا يخليكي ليا وميحرمنيش منك أبداً ❤️</p>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const questionContainer = document.getElementById('question-container');
        const resultContainer = document.getElementById('result-container');
        const music = document.getElementById('celebration-music');

        // جمل طريفة تظهر على زر "لأ" في كل مرة يهرب فيها
        const funnyPhrases = [
            "لأ؟ فكري تاني! 😂",
            "مش هتلحقي تدوسي 😜",
            "سريعة صح؟ 🏃‍♀️",
            "مفيش مفر خلاص!",
            "الزرار ده بايظ 🙃",
            "جربي التاني أسهل 😉",
            "مستحيل أسمحلك! ✋"
        ];

        let phraseIndex = 0;
        let yesScale = 1;

        // وظيفة تحريك زر "لأ"
        function moveButton() {
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const padding = 20;

            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.zIndex = '999';

            // تغيير الجملة على الزر
            noBtn.innerText = funnyPhrases[phraseIndex % funnyPhrases.length];
            phraseIndex++;

            // تكبير زر "أيوة" تدريجياً ليكون أسهل في الضغط
            yesScale += 0.08;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        // أحداث الهروب لزر "لأ"
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        // عند الضغط على "أيوة"
        yesBtn.addEventListener('click', () => {
            questionContainer.style.display = 'none';
            resultContainer.style.display = 'block';
            noBtn.style.display = 'none'; // إخفاء زر "لأ" نهائياً
            
            // تشغيل الموسيقى
            music.play().catch(() => {});

            // إطلاق قصاصات الاحتفال (Confetti)
            triggerCelebration();
        });

        // وظيفة الاحتفال بالمفرقعات الملونة
        function triggerCelebration() {
            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff4b72', '#ffffff', '#ffd1dc']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff4b72', '#ffffff', '#ffd1dc']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // توليد قلوب عائمة تلقائياً في الخلفية
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.fontSize = (Math.random() * 18 + 14) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 450);
    </script>
</body>
</html>
